name: Publier le portfolio sur GitHub Pages

# Le site est statique : aucun build. Le dépôt est publié tel quel, à l'exception
# des fichiers de travail listés dans l'étape « Préparer le site ».
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Activer Pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Préparer le site
        run: |
          mkdir _site
          cp -r index.html 404.html robots.txt sitemap.xml assets _site/

      - name: Empaqueter
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
