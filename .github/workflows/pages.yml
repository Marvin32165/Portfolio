name: Publier le portfolio

# Site statique, aucun build. À chaque push sur main, le workflow recopie les seuls
# fichiers du site dans la branche gh-pages, que GitHub Pages publie.
#
# Réglage à faire une seule fois :
#   Settings → Pages → Build and deployment → Source : « Deploy from a branch »
#   → Branch : gh-pages, dossier / (root)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publication
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer main
        uses: actions/checkout@v4

      - name: Récupérer gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: _pages

      - name: Copier le site
        run: |
          find _pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r index.html 404.html robots.txt sitemap.xml assets _pages/
          touch _pages/.nojekyll

      - name: Publier
        working-directory: _pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Rien à publier."
          else
            git commit -m "Publication depuis ${GITHUB_SHA::7}"
            git push origin gh-pages
          fi
